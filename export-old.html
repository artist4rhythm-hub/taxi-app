<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>황금기사 · 예전 기록 꺼내기</title>
<style>
  :root { --bg:#0e0f12; --surface:#17191e; --line:#2a2d34; --text:#f2f0ea; --dim:#a3a5ab; --gold:#f2b33d; --bad:#ff6b6b; --ok:#3dd68c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; font-size: 17px; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 24px; margin: 0 0 6px; color: var(--gold); }
  p { color: var(--dim); line-height: 1.6; margin: 0 0 18px; word-break: keep-all; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
  label { display: block; font-size: 15px; color: var(--dim); margin: 12px 0 6px; }
  input { width: 100%; height: 54px; border-radius: 14px; border: 1.5px solid var(--line); background: #1f2228; color: var(--text); font-size: 18px; padding: 0 14px; }
  input:focus { outline: none; border-color: var(--gold); }
  button { width: 100%; min-height: 56px; margin-top: 18px; border: none; border-radius: 16px; background: var(--gold); color: #17130a; font-size: 18px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 16px; font-size: 16px; line-height: 1.6; min-height: 1.6em; word-break: keep-all; }
  .err { color: var(--bad); } .ok { color: var(--ok); }
  ol { color: var(--dim); padding-left: 20px; line-height: 1.7; font-size: 15px; margin: 18px 0 0; }
</style>
</head>
<body>
<main>
  <h1>예전 기록 꺼내기</h1>
  <p>예전 택시 매출 앱에서 쓰던 <b>이메일과 비밀번호</b>로 로그인하면, 매출 기록과 급여 조건을 파일 하나로 받아요. 받은 파일은 새 황금기사 앱에서 [더보기 › 문의하기·백업 › 복원]으로 넣으면 돼요.</p>
  <div class="card">
    <label for="email">예전 앱 이메일</label>
    <input id="email" type="email" autocomplete="username" placeholder="example@email.com">
    <label for="pw">예전 앱 비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
    <button id="go" onclick="run()">로그인하고 백업 파일 받기</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </div>
  <ol>
    <li>여기서 받은 파일(황금기사_예전기록_날짜.json)을 잘 보관해요.</li>
    <li>새 황금기사 앱에 가입하고, 관리자가 등급을 지정해 주면</li>
    <li>더보기 › 문의하기·백업 › 복원에서 이 파일을 골라요.</li>
  </ol>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // 예전 앱(driver-leemoojong) 연결 — 기록을 읽기만 하고 아무것도 바꾸지 않아요
  const OLD = firebase.initializeApp({
    apiKey: "AIzaSyCG5PqWKzsJQADzebyPbDxN2IPsfazGDv0",
    authDomain: "driver-leemoojong.firebaseapp.com",
    projectId: "driver-leemoojong",
    storageBucket: "driver-leemoojong.firebasestorage.app",
    messagingSenderId: "670178767270",
    appId: "1:670178767270:web:567f8ad68848deb2a69f67"
  }, 'old');
  const auth = OLD.auth(), db = OLD.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => {});

  function say(t, cls) { const m = document.getElementById('msg'); m.textContent = t; m.className = cls || ''; }

  async function run() {
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('pw').value;
    if (!email || !pw) return say('이메일과 비밀번호를 넣어주세요.', 'err');
    const btn = document.getElementById('go'); btn.disabled = true;
    try {
      say('로그인하는 중...');
      const cred = await auth.signInWithEmailAndPassword(email, pw);
      const uid = cred.user.uid, uref = db.collection('users').doc(uid);
      say('기록을 모으는 중...');
      const days = {};
      (await uref.collection('records').get()).forEach(d => {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d.id)) return;
        const r = d.data() || {};
        days[d.id] = { revenue: r.revenue || 0, fuel: r.fuel || 0, gas: r.gas || 0, memo: r.memo || '', logs: Array.isArray(r.logs) ? r.logs : [] };
      });
      const salaryRules = {};
      (await uref.collection('salaryRules').get()).forEach(d => { salaryRules[d.id] = d.data(); });
      const salaryHistory = [];
      (await uref.collection('salaryHistory').get()).forEach(d => salaryHistory.push({ month: d.id, ...d.data() }));
      let settings = null;
      try { const u = await uref.get(); if (u.exists) settings = u.data().settings || null; } catch (e) {}
      // 저장된 월별 조건이 없고 최신 설정만 있으면 이번 달 조건으로 넣어둠
      if (!Object.keys(salaryRules).length && settings) {
        const now = new Date();
        salaryRules[`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`] = settings;
      }
      const payload = {
        app: 'taxi-revenue', version: 2, exportedAt: new Date().toISOString(), user: email,
        source: 'driver-leemoojong', dayCount: Object.keys(days).length,
        days, salaryHistory, salaryRules, workPattern: null, goalPay: 0,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      const t = new Date();
      a.href = URL.createObjectURL(blob);
      a.download = `황금기사_예전기록_${t.getFullYear()}${String(t.getMonth() + 1).padStart(2, '0')}${String(t.getDate()).padStart(2, '0')}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      say(`✅ 기록 ${Object.keys(days).length}일, 급여 조건 ${Object.keys(salaryRules).length}개를 파일로 받았어요.`, 'ok');
      await auth.signOut();
    } catch (e) {
      const m = { 'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않아요.', 'auth/wrong-password': '비밀번호가 맞지 않아요.', 'auth/user-not-found': '예전 앱에 이 이메일로 가입된 계정이 없어요.', 'auth/too-many-requests': '시도가 너무 많아요. 잠시 후 다시 해주세요.' };
      say(m[e.code] || ('받기에 실패했어요: ' + (e.message || e)), 'err');
    } finally { btn.disabled = false; }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
